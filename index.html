<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Trắc Nghiệm - Vật Lý Đại Cương 1 (Chương 2)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #e2e8f0;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }
        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .option-item.disabled {
            cursor: default;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--primary-color);
            font-size: 28px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VẬT LÝ ĐẠI CƯƠNG 1 - CƠ NHIỆT</h1>
    <div class="subtitle">Chương 2: Động Lực Học Chất Điểm (96 Câu - Đầy đủ đáp án & Lời giải)</div>

    <div id="quiz-screen">
        <div class="quiz-controls">
            <span id="question-counter">Câu 1 / 96</span>
            <span id="score-tracker">Điểm: 0</span>
        </div>

        <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
        
        <ul class="options-list" id="options-container">
            <!-- Các phương án -->
        </ul>

        <div class="explanation" id="explanation-box">
            <strong>💡 Giải thích chi tiết:</strong> <span id="explanation-text"></span>
        </div>

        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Câu trước</button>
            <button id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>Hoàn thành bài ôn tập Chương 2!</h2>
        <p id="final-score" style="font-size: 20px; margin: 20px 0;"></p>
        <button onclick="restartQuiz()">Làm lại từ đầu</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1. Một vật đang chuyển động sang phải. Tại một thời điểm, hợp lực tác dụng lên vật hướng sang trái. Khẳng định nào luôn đúng?",
            options: [
                "Vật đang chuyển động sang trái.",
                "Vật lập tức đổi chiều.",

            correct: 2,
            explain: "Theo định luật II Newton, gia tốc a = F/m luôn cùng hướng với hợp lực F. Hợp lực hướng sang trái thì gia tốc chắc chắn hướng sang trái."
        },
        {
            q: "Câu 2. Một quyển sách nằm yên trên mặt bàn. Trọng lực tác dụng lên sách và phản lực của bàn tác dụng lên sách",
            options: [
                "là cặp lực và phản lực theo định luật III Newton.",
                "có cùng độ lớn vì là cặp lực và phản lực.",
                "cùng tác dụng lên một vật nên không phải cặp lực và phản lực.",
                "không thể có cùng độ lớn."
            ],
            correct: 2,
            explain: "Lực và phản lực theo Định luật III Newton phải đặt vào hai vật khác nhau. Trọng lực và phản lực của bàn cùng đặt vào quyển sách nên đây là hai lực cân bằng, không phải lực và phản lực."
        },
        {
            q: "Câu 3. Khi một người đẩy vào tường, tường tác dụng trở lại người một lực",
            options: [
                "chỉ xuất hiện nếu tường chuyển động.",
                "nhỏ hơn lực người tác dụng lên tường.",
                "lớn hơn lực người tác dụng lên tường.",
                "bằng về độ lớn và ngược hướng với lực người tác dụng lên tường."
            ],
            correct: 3,
            explain: "Theo Định luật III Newton, hai lực tương tác giữa hai vật luôn cùng độ lớn và ngược hướng."
        },
        {
            q: "Câu 4. Một vật chuyển động thẳng với vận tốc không đổi. Điều nào sau đây đúng?",
            options: [
                "Không có lực nào tác dụng lên vật.",
                "Hợp lực tác dụng lên vật bằng 0.",
                "Chỉ có trọng lực tác dụng lên vật.",
                "Gia tốc của vật có thể khác 0."

            correct: 1,
            explain: "Theo Định luật I Newton, vật chuyển động thẳng đều (vận tốc không đổi) thì gia tốc a = 0, suy ra hợp lực tác dụng lên vật phải bằng 0."
        },
        {
            q: "Câu 5. Một ô tô rẽ trên đường nằm ngang. Lực đóng vai trò quan trọng tạo gia tốc hướng tâm cho ô tô là",
            options: [
                "trọng lực.",
                "phản lực của mặt đường.",
                "lực ma sát giữa lốp và mặt đường.",
                "lực quán tính ly tâm."
            ],
            correct: 2,
            explain: "Khi ô tô rẽ trên đường nằm ngang, lực ma sát nghỉ giữa lốp xe và mặt đường đóng vai trò làm lực hướng tâm giữ cho xe không bị trượt ra ngoài."
        },
        {
            q: "Câu 6. Ô tô phanh gấp, người ngồi trong xe có xu hướng chúi về phía trước. Giải thích phù hợp nhất là.",
            options: [
                "Có một lực mới đẩy người về phía trước.",

                "Phản lực của ghế đổi hướng về phía trước."

            explain: "Đây là hiện tượng quán tính: cơ thể người có tính chất giữ nguyên vận tốc ban đầu khi xe đột ngột giảm tốc."
        },
        {
            q: "Câu 7. Hãy chọn câu đúng. Quán tính của một vật là.",

            correct: 1,
            explain: "Vận động viên dậm đà nhằm mục đích chuyển hóa động năng tịnh tiến nằm ngang thành động năng bay lên cao, không phải là hiện tượng giữ nguyên vận tốc theo quán tính thụ động."
        },
        {
            q: "Câu 9. Chọn câu sai.",

                "Lực là nguyên nhân làm biến đổi vận tốc.",
                "Lực là nguyên nhân làm biến dạng vật."

            correct: 1,
            explain: "Lực không phải là nguyên nhân gây ra vận tốc (vật không chịu lực vẫn có thể chuyển động thẳng đều với vận tốc không đổi), lực chỉ gây ra gia tốc làm biến đổi vận tốc."
        },
        {
            q: "Câu 10. Một ô tô đi qua đỉnh đoạn đường cong lồi với tốc độ khác 0. Coi đoạn đường tại đỉnh là một cung tròn; xe vẫn tiếp xúc với đường. So với trọng lượng mg, độ lớn phản lực của đường lên xe tại đỉnh.",
            options: [
                "Lớn hơn mg",
                "Bằng mg",
                "Nhỏ hơn mg",
                "Bằng 0 ở mọi tốc độ"
            ],
            correct: 2,
            explain: "Tại đỉnh đường cong lồi: P - N = m*v²/R => N = mg - m*v²/R < mg."
        },
        {
            q: "Câu 11. Theo định luật II Newton, gia tốc của một vật.",
            options: [
                "Luôn cùng hướng với vận tốc của vật.",
                "Luôn cùng hướng với hợp lực tác dụng lên vật.",
                "Luôn ngược hướng với hợp lực tác dụng lên vật.",
                "Không phụ thuộc vào khối lượng của vật."
            ],
            correct: 1,
            explain: "Vector gia tốc a = F/m luôn cùng hướng với vector hợp lực F."
        },
        {
            q: "Câu 12. Phát biểu nào sau đây đúng về lực ma sát trượt?",

                "Luôn cùng hướng với vận tốc của vật.",
                "Luôn vuông góc với mặt tiếp xúc.",
                "Có phương song song với mặt tiếp xúc và ngược chiều chuyển động tương đối.",
                "Luôn có độ lớn bằng trọng lực của vật."
            ],
            correct: 2,
            explain: "Lực ma sát trượt xuất hiện tại mặt tiếp xúc, có phương song song với mặt tiếp xúc và ngược chiều với chuyển động tương đối."
        },
        {
            q: "Câu 13. Khi hợp lực tác dụng lên một vật tăng lên 2 lần, trong khi khối lượng của vật không đổi, gia tốc của vật sẽ.",
            options: [
                "Giảm 2 lần.",
                "Không thay đổi.",
                "Tăng lên 2 lần.",
                "Tăng lên 4 lần."
            ],
            correct: 2,
            explain: "Theo công thức a = F/m, khi m không đổi và F tăng 2 lần thì gia tốc a tăng lên 2 lần."
        },
        {
            q: "Câu 14. Phát biểu nào sau đây là sai khi nói về lực và phản lực trong Định luật III Newton?",
            options: [
                "Lực và phản lực luôn xuất hiện và mất đi đồng thời.",
                "Lực và phản lực là hai lực trực đối, có cùng giá, cùng độ lớn nhưng ngược chiều.",
                "Lực và phản lực cân bằng nhau vì chúng có cùng độ lớn và ngược chiều.",
                "Lực và phản lực là hai lực cùng loại (ví dụ cùng là lực đàn hồi hoặc cùng là lực hấp dẫn)."
            ],
            correct: 2,
            explain: "Lực và phản lực không cân bằng nhau vì chúng đặt vào hai vật khác nhau."
        },
        {

    let currentQuestion = 0;

    let answered = false;

    const questionCounter = document.getElementById("question-counter");
    const scoreTracker = document.getElementById("score-tracker");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationText = document.getElementById("explanation-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreCard = document.getElementById("score-card");
    const finalScore = document.getElementById("final-score");

    function loadQuestion() {
        answered = false;
        explanationBox.style.display = "none";
        nextBtn.disabled = true;
        prevBtn.disabled = currentQuestion === 0;

        const q = quizData[currentQuestion];
        questionCounter.innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
        scoreTracker.innerText = `Điểm: ${score}`;
        questionText.innerText = q.q;

        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const options = optionsContainer.children;

        if (selectedIndex === q.correct) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            options[q.correct].classList.add("correct");
        }

        for (let opt of options) {
            opt.classList.add("disabled");
        }

        scoreTracker.innerText = `Điểm: ${score}`;
        explanationText.innerText = q.explain;
        explanationBox.style.display = "block";
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        finalScore.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu. (Đạt ${(score/quizData.length*10).toFixed(1)} điểm)`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>
