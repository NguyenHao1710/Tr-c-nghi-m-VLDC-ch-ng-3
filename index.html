<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Trắc Nghiệm - Vật Lý Đại Cương 1 (Chương 3)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #e2e8f0;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }
        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .option-item.disabled {
            cursor: default;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .jump-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .jump-box input {
            width: 60px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--primary-color);
            font-size: 28px;
        }
        .note-diagram {
            display: block;
            font-size: 14px;
            font-weight: normal;
            color: #475569;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VẬT LÝ ĐẠI CƯƠNG 1 - CƠ NHIỆT</h1>
    <div class="subtitle">Chương 3: Các Định Luật Bảo Toàn Trong Cơ Học (94 Câu - Đầy đủ đáp án & Lời giải)</div>

    <div id="quiz-screen">
        <div class="quiz-controls">
            <span id="question-counter">Câu 1 / 94</span>
            <div class="jump-box">
                <span>Đến câu:</span>
                <input type="number" id="jump-input" min="1" max="94" placeholder="1-94">
                <button style="padding: 6px 12px; font-size: 14px;" onclick="jumpToQuestion()">Đi</button>
            </div>
            <span id="score-tracker">Điểm: 0</span>
        </div>

        <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
        
        <ul class="options-list" id="options-container"></ul>

        <div class="explanation" id="explanation-box">
            <strong>💡 Giải thích chi tiết:</strong> <span id="explanation-text"></span>
        </div>

        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Câu trước</button>
            <button id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>Hoàn thành bài ôn tập Chương 3!</h2>
        <p id="final-score" style="font-size: 20px; margin: 20px 0;"></p>
        <button onclick="restartQuiz()">Làm lại từ đầu</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1. Một quả bóng được ném thẳng đứng lên cao. Bỏ qua sức cản không khí. Khi bóng đi lên,",
            options: [
                "A. động năng và thế năng đều giảm.",
                "B. động năng giảm, thế năng tăng và cơ năng không đổi.",
                "C. động năng tăng, thế năng giảm và cơ năng không đổi.",
                "D. động năng giảm nên cơ năng giảm."
            ],
            correct: 1,
            explain: "Khi bóng đi lên, vận tốc giảm nên động năng giảm; độ cao tăng nên thế năng tăng. Bỏ qua sức cản không khí nên cơ năng bảo toàn (không đổi)."
        },
        {
            q: "Câu 2. Trong một va chạm của hệ cô lập, đại lượng nào luôn được bảo toàn?",
            options: [
                "A. Động năng.",
                "B. Cơ năng.",
                "C. Động lượng.",
                "D. Vận tốc của từng vật."
            ],
            correct: 2,
            explain: "Trong hệ cô lập, tổng ngoại lực bằng 0 nên động lượng toàn phần của hệ luôn được bảo toàn trong mọi loại va chạm."
        },
        {
            q: "Câu 3. Trong va chạm hoàn toàn không đàn hồi của một hệ cô lập,",
            options: [
                "A. cả động lượng và động năng đều bảo toàn.",
                "B. động lượng bảo toàn nhưng động năng không bảo toàn.",
                "C. động năng bảo toàn nhưng động lượng không bảo toàn.",
                "D. cả động lượng và động năng đều không bảo toàn."
            ],
            correct: 1,
            explain: "Va chạm hoàn toàn không đàn hồi (va chạm mềm) luôn bảo toàn động lượng (nếu hệ cô lập), nhưng một phần động năng chuyển hóa thành nhiệt và công biến dạng nên động năng không bảo toàn."
        },
        {
            q: "Câu 4. Một vật chuyển động chỉ dưới tác dụng của lực thế. Khi động năng của vật tăng thì",
            options: [
                "A. thế năng cũng tăng.",
                "B. thế năng giảm.",
                "C. cơ năng tăng.",
                "D. cơ năng giảm."
            ],
            correct: 1,
            explain: "Chỉ có lực thế tác dụng nên cơ năng W = Wđ + Wt không đổi. Do đó khi động năng tăng thì thế năng phải giảm tương ứng."
        },
        {
            q: "Câu 5. Mômen ngoại lực tổng hợp đối với một hệ bằng 0. Khi đó",
            options: [
                "A. động lượng của hệ nhất thiết bằng 0.",
                "B. mômen động lượng của hệ được bảo toàn.",
                "C. động năng của hệ được bảo toàn.",
                "D. hệ không thể quay."
            ],
            correct: 1,
            explain: "Theo định luật bảo toàn mômen động lượng, khi tổng mômen ngoại lực đối với một trục hoặc một điểm bằng 0 thì mômen động lượng của hệ được bảo toàn."
        },
        {
            q: "Câu 6. Một người đứng trên một chiếc thuyền đang đứng yên trên mặt nước. Khi người bước về phía mũi thuyền, thuyền chuyển động về phía ngược lại. Bỏ qua lực cản của nước. Nguyên nhân phù hợp nhất là",
            options: [
                "A. thuyền luôn phải chuyển động ngược chiều người.",
                "B. người tác dụng lực lớn hơn lên thuyền so với lực thuyền tác dụng lên người.",
                "C. tổng động lượng của hệ người thuyền được bảo toàn.",
                "D. động năng của hệ người thuyền luôn được bảo toàn."
            ],
            correct: 2,
            explain: "Hệ người và thuyền theo phương ngang là hệ cô lập (tổng động lượng ban đầu bằng 0), nên khi người tiến về trước thì thuyền phải lùi về sau để tổng động lượng bằng 0."
        },
        {
            q: "Câu 7. Một vật được ném thẳng đứng lên cao. Bỏ qua sức cản không khí. Khi vật đi từ vị trí thấp đến một vị trí cao hơn, phát biểu nào đúng?",
            options: [
                "A. Độ giảm động năng lớn hơn độ tăng thế năng.",
                "B. Độ tăng thế năng lớn hơn độ giảm động năng.",
                "C. Độ giảm động năng bằng độ tăng thế năng.",
                "D. Động năng không thay đổi vì cơ năng được bảo toàn."
            ],
            correct: 2,
            explain: "Vì cơ năng bảo toàn (ΔWđ + ΔWt = 0), nên độ giảm động năng bằng đúng độ tăng thế năng."
        },
        {
            q: "Câu 8. Một vật trượt từ trạng thái nghỉ xuống một mặt phẳng nghiêng có ma sát. Trong quá trình vật trượt xuống",
            options: [
                "A. cơ năng của vật được bảo toàn vì trọng lực là lực thế.",
                "B. động năng của vật giảm vì có ma sát.",
                "C. một phần cơ năng của vật chuyển thành nội năng do ma sát.",
                "D. tổng năng lượng của vật và môi trường giảm dần."
            ],
            correct: 2,
            explain: "Lực ma sát thực hiện công âm làm tiêu hao cơ năng của vật, chuyển hóa một phần cơ năng thành nội năng (nhiệt lượng)."
        },
        {
            q: "Câu 9. Hai vật có khối lượng khác nhau đang chuyển động với cùng động lượng. Vật có khối lượng nhỏ hơn sẽ",
            options: [
                "A. có động năng nhỏ hơn.",
                "B. có cùng động năng với vật kia.",
                "C. có động năng lớn hơn.",
                "D. có động năng bằng 0."
            ],
            correct: 2,
            explain: "Liên hệ giữa động năng và động lượng: Wđ = p² / (2m). Khi hai vật có cùng động lượng p, vật nào có khối lượng m nhỏ hơn thì có động năng Wđ lớn hơn."
        },
        {
            q: "Câu 10. Một vật được ném thẳng đứng lên cao rồi rơi trở lại đúng vị trí ném. Bỏ qua sức cản không khí. Công của trọng lực trong toàn bộ quá trình bằng",
            options: [
                "A. dương vì vật rơi xuống dưới tác dụng của trọng lực.",
                "B. âm vì khi đi lên trọng lực ngược chiều chuyển động.",
                "C. bằng 0 vì vị trí đầu và cuối có cùng độ cao.",
                "D. phụ thuộc vào vận tốc ném ban đầu."
            ],
            correct: 2,
            explain: "Trọng lực là lực thế, công của trọng lực chỉ phụ thuộc vào độ chênh lệch độ cao giữa điểm đầu và điểm cuối: A = mg(z₁ - z₂). Vì z₁ = z₂ nên A = 0."
        },
        {
            q: "Câu 11. Khi một vật trượt lên một mặt phẳng nghiêng có ma sát dưới tác dụng của trọng lực và lực ma sát, phát biểu nào sau đây về công và cơ năng là đúng?",
            options: [
                "A. Công của lực ma sát luôn dương và tổng cơ năng của vật được bảo toàn hoàn toàn.",
                "B. Công của lực ma sát luôn âm, nó làm tiêu hao một phần cơ năng của hệ và chuyển hóa thành nhiệt năng.",
                "C. Trọng lực sinh công dương, do đó cơ năng của vật luôn tăng lên trong suốt quá trình chuyển động.",
                "D. Lực ma sát không sinh công vì nó luôn vuông góc với quỹ đạo chuyển động của vật."
            ],
            correct: 1,
            explain: "Lực ma sát ngược chiều chuyển động nên sinh công âm, làm giảm cơ năng của vật và chuyển hóa thành nhiệt năng."
        },
        {
            q: "Câu 12. Một người đẩy một chiếc xe đẩy theo phương ngang nhưng xe không dịch chuyển. Công của lực đẩy tác dụng lên xe bằng",
            options: [
                "A. Dương vì người đang tác dụng lực lên xe.",
                "B. Âm vì lực của người làm xe có xu hướng chuyển động.",
                "C. Bằng 0 vì điểm đặt của lực không có độ dời.",
                "D. Không thể xác định nếu chưa biết khối lượng của xe."
            ],
            correct: 2,
            explain: "Công cơ học A = F·s·cos(α). Khi xe không dịch chuyển thì độ dời s = 0, do đó công của lực đẩy bằng 0."
        },
        {
            q: "Câu 13. Một vật trượt không ma sát từ vị trí cao xuống vị trí thấp. Trong quá trình chuyển động, đại lượng nào sau đây được bảo toàn?",
            options: [
                "A. Động năng.",
                "B. Thế năng.",
                "C. Cơ năng.",
                "D. Động lượng của vật trong mọi trường hợp."
            ],
            correct: 2,
            explain: "Vật trượt không ma sát chỉ có trọng lực (lực thế) sinh công nên cơ năng của vật được bảo toàn."
        },
        {
            q: "Câu 14. Một quả bóng được ném thẳng đứng lên cao, bỏ qua lực cản không khí. Khi quả bóng đạt đến vị trí cao nhất,",
            options: [
                "A. Động năng và thế năng đều bằng 0.",
                "B. Động năng cực đại và thế năng cực tiểu.",
                "C. Động năng cực tiểu và thế năng cực đại.",
                "D. Cơ năng của quả bóng bằng 0."
            ],
            correct: 2,
            explain: "Tại vị trí cao nhất, vận tốc bằng 0 nên động năng cực tiểu (bằng 0), còn độ cao lớn nhất nên thế năng đạt cực đại."
        },
        {
            q: "Câu 15. Một vật trượt xuống một mặt phẳng nghiêng có ma sát. Phát biểu nào sau đây đúng?",
            options: [
                "A. Cơ năng của vật được bảo toàn vì trọng lực là lực thế.",
                "B. Cơ năng của vật tăng vì vật chuyển động xuống thấp.",
                "C. Cơ năng của vật giảm do một phần cơ năng chuyển hóa thành nhiệt năng.",
                "D. Động năng và thế năng đều không thay đổi."
            ],
            correct: 2,
            explain: "Do có lực ma sát sinh công cản (công âm), cơ năng của vật giảm đi và chuyển hóa thành nhiệt năng."
        },
        {
            q: "Câu 16. Trong quá trình chuyển động của một chất điểm, công của trọng lực không phụ thuộc vào yếu tố nào sau đây?",
            options: [
                "A. Khối lượng của chất điểm",
                "B. Độ cao ban đầu của chất điểm",
                "C. Độ cao lúc sau của chất điểm",
                "D. Hình dạng đường đi của chất điểm"
            ],
            correct: 3,
            explain: "Trọng lực là lực thế nên công của trọng lực chỉ phụ thuộc vị trí đầu và cuối, không phụ thuộc hình dạng đường đi."
        },
        {
            q: "Câu 17. Trong hệ SI, 1 J (Joule) bằng",
            options: [
                "A. 1 kg·m·s⁻¹.",
                "B. 1 kg·m·s⁻².",
                "C. 1 kg·m²·s⁻³.",
                "D. 1 kg·m²·s⁻²."
            ],
            correct: 3,
            explain: "1 J = 1 N·m = 1 (kg·m·s⁻²)·m = 1 kg·m²·s⁻²."
        },
        {
            q: "Câu 18. Hai người đứng trên ván trượt, ban đầu cùng đứng yên trên nền gần như không có ma sát. Họ đẩy nhau rồi chuyển động ngược chiều. Nếu chọn hệ gồm cả hai người và ván trượt, tổng động lượng theo phương ngang ngay sau khi đẩy là",
            options: [
                "A. Lớn hơn 0 theo hướng người nặng hơn.",
                "B. Lớn hơn 0 theo hướng người nhẹ hơn.",
                "C. Bằng 0.",
                "D. Phụ thuộc độ mạnh của cú đẩy."
            ],
            correct: 2,
            explain: "Hệ cô lập theo phương ngang có tổng động lượng ban đầu bằng 0, nên ngay sau khi đẩy nhau tổng động lượng vẫn bằng 0."
        },
        {
            q: "Câu 19. Một quả bóng rơi xuống sàn rồi nảy lên đến độ cao thấp hơn độ cao ban đầu. Nếu chọn hệ gồm bóng, sàn và Trái Đất, phát biểu nào phù hợp nhất?",
            options: [
                "A. Năng lượng của hệ biến mất sau va chạm.",

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById("question-counter");
    const scoreTracker = document.getElementById("score-tracker");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationText = document.getElementById("explanation-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreCard = document.getElementById("score-card");
    const finalScore = document.getElementById("final-score");
    const jumpInput = document.getElementById("jump-input");

    function loadQuestion() {
        answered = false;
        explanationBox.style.display = "none";
        nextBtn.disabled = true;
        prevBtn.disabled = currentQuestion === 0;

        const q = quizData[currentQuestion];
        questionCounter.innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
        scoreTracker.innerText = `Điểm: ${score}`;
        questionText.innerHTML = q.q;
        jumpInput.value = currentQuestion + 1;

        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const options = optionsContainer.children;

        if (selectedIndex === q.correct) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            options[q.correct].classList.add("correct");
        }

        for (let opt of options) {
            opt.classList.add("disabled");
        }

        scoreTracker.innerText = `Điểm: ${score}`;
        explanationText.innerText = q.explain;
        explanationBox.style.display = "block";
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function jumpToQuestion() {
        const val = parseInt(jumpInput.value);
        if (val >= 1 && val <= quizData.length) {
            currentQuestion = val - 1;
            loadQuestion();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        finalScore.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu. (Đạt ${(score/quizData.length*10).toFixed(1)} điểm)`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
