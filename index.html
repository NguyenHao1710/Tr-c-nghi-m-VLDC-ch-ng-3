<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Trắc Nghiệm - Vật Lý Đại Cương 1 (Chương 3 & 4)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #e2e8f0;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }
        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .option-item.disabled {
            cursor: default;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--primary-color);
            font-size: 28px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VẬT LÝ ĐẠI CƯƠNG 1 - CƠ NHIỆT</h1>
    <div class="subtitle">Chương 3 & 4: Các Định Luật Bảo Toàn & Cơ Học Vật Rắn (Đầy đủ đáp án & Lời giải)</div>

        </ul>

        </div>

        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Câu trước</button>
            <button id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
        </div>

        <p id="final-score" style="font-size: 20px; margin: 20px 0;"></p>

    </div>
</div>

    const finalScore = document.getElementById("final-score");

    function loadQuestion() {
        answered = false;
        explanationBox.style.display = "none";
        nextBtn.disabled = true;
        prevBtn.disabled = currentQuestion === 0;

        const q = quizData[currentQuestion];
        questionCounter.innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
        scoreTracker.innerText = `Điểm: ${score}`;
        questionText.innerText = q.q;

        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const options = optionsContainer.children;

        if (selectedIndex === q.correct) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            options[q.correct].classList.add("correct");
        }

        for (let opt of options) {
            opt.classList.add("disabled");
        }

        scoreTracker.innerText = `Điểm: ${score}`;
        explanationText.innerText = q.explain;
        explanationBox.style.display = "block";
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        finalScore.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu. (Đạt ${(score/quizData.length*10).toFixed(1)} điểm)`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
