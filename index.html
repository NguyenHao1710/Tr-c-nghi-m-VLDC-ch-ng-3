<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Trắc Nghiệm - Vật Lý Đại Cương 1 (Chương 3)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #e2e8f0;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }
        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .option-item.disabled {
            cursor: default;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--primary-color);
            font-size: 28px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VẬT LÝ ĐẠI CƯƠNG 1 - CƠ NHIỆT</h1>
    <div class="subtitle">Chương 3: Các Định Luật Bảo Toàn (Đầy đủ 91 Câu - Đáp án & Lời giải chuẩn)</div>

    <div id="quiz-screen">
        <div class="quiz-controls">
            <span id="question-counter">Câu 1 / 91</span>
            <span id="score-tracker">Điểm: 0</span>
        </div>

        <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
        
        <ul class="options-list" id="options-container">
            <!-- Các phương án -->
        </ul>

        <div class="explanation" id="explanation-box">
            <strong>💡 Giải thích chi tiết:</strong> <span id="explanation-text"></span>
        </div>

        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Câu trước</button>
            <button id="next-btn" onclick="nextQuestion()" disabled>Câu tiếp theo</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>Hoàn thành bài ôn tập Chương 3!</h2>
        <p id="final-score" style="font-size: 20px; margin: 20px 0;"></p>
        <button onclick="restartQuiz()">Làm lại từ đầu</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Câu 1. Trong một hệ cô lập, khi xảy ra va chạm (đàn hồi hoặc không đàn hồi), đại lượng nào sau đây luôn được bảo toàn?",
            options: [
                "Chỉ động năng của hệ.",
                "Chỉ cơ năng của hệ.",
                "Động lượng toàn phần của hệ.",
                "Cả động lượng và cơ năng của hệ."
            ],
            correct: 2,
            explain: "Trong mọi va chạm nếu hệ được coi là cô lập (thời gian va chạm rất ngắn, ngoại lực triệt tiêu), động lượng toàn phần của hệ luôn được bảo toàn. Cơ năng chỉ bảo toàn trong va chạm hoàn toàn đàn hồi."
        },
        {
            q: "Câu 2. Phát biểu nào sau đây đúng khi nói về va chạm đàn hồi và va chạm không đàn hồi (va chạm mềm)?",
            options: [
                "Cả hai loại va chạm đều bảo toàn động năng.",
                "Va chạm đàn hồi bảo toàn động năng, va chạm mềm không bảo toàn động năng.",
                "Va chạm mềm bảo toàn động năng, va chạm đàn hồi không bảo toàn động năng.",
                "Cả hai loại va chạm đều không bảo toàn động lượng."
            ],
            correct: 1,
            explain: "Va chạm đàn hồi bảo toàn cả động lượng và động năng; va chạm mềm chỉ bảo toàn động lượng, động năng bị tiêu hao một phần thành nhiệt năng hoặc biến dạng."
        },
        {
            q: "Câu 3. Công của lực thế tác dụng lên một vật di chuyển từ điểm A đến điểm B phụ thuộc vào yếu tố nào?",
            options: [
                "Đường đi từ A đến B.",
                "Hình dạng quỹ đạo chuyển động.",
                "Chỉ phụ thuộc vào vị trí điểm đầu A và điểm cuối B.",
                "Vận tốc của vật tại điểm A."
            ],
            correct: 2,
            explain: "Lực thế (như trọng lực, lực đàn hồi) có công không phụ thuộc vào hình dạng quỹ đạo mà chỉ phụ thuộc vào vị trí điểm đầu và điểm cuối."
        },
        {
            q: "Câu 4. Biểu thức tính công của một lực không đổi F làm dịch chuyển một đoạn đường s theo hướng hợp với lực một góc alpha là",
            options: [
                "A = F * s * sin(alpha).",
                "A = F * s * cos(alpha).",
                "A = F / (s * cos(alpha)).",
                "A = 0.5 * F * s^2."
            ],
            correct: 1,
            explain: "Công thức tổng quát tính công cơ học: A = F * s * cos(alpha)."
        },
        {
            q: "Câu 5. Định lý biến thiên động năng phát biểu: Độ biến thiên động năng của một vật bằng",
            options: [
                "công của trọng lực tác dụng lên vật.",
                "công của tất cả các lực (ngoại lực và nội lực) tác dụng lên vật.",
                "độ giảm thế năng của vật.",
                "cơ năng của vật."
            ],
            correct: 1,
            explain: "Độ biến thiên động năng của chất điểm trong một khoảng thời gian bằng tổng công của tất cả các lực tác dụng lên nó: W_d2 - W_d1 = A."
        },
        {
            q: "Câu 6. Khi chỉ có các lực thế (như trọng lực, lực đàn hồi) sinh công làm biến đổi chuyển động của hệ, đại lượng nào sau đây được bảo toàn?",
            options: [
                "Động năng của hệ.",
                "Thế năng của hệ.",
                "Cơ năng toàn phần của hệ.",
                "Động lượng của hệ."
            ],
            correct: 2,
            explain: "Khi hệ chỉ chịu tác dụng của các lực thế sinh công (không có lực ma sát, lực cản), cơ năng toàn phần W = W_d + W_t được bảo toàn."
        },
        {
            q: "Câu 7. Một hệ cơ học được gọi là hệ cô lập khi nào?",
            options: [
                "Tổng các ngoại lực tác dụng lên hệ bằng không.",
                "Hệ không chịu tác dụng của bất kỳ lực nào kể cả nội lực.",
                "Các vật trong hệ chuyển động thẳng đều.",
                "Khối lượng của hệ không đổi theo thời gian."
            ],
            correct: 0,
            explain: "Hệ cô lập (hệ kín) là hệ không chịu tác dụng của ngoại lực, hoặc tổng véc-tơ các ngoại lực tác dụng lên hệ triệt tiêu bằng 0."
        },
        {
            q: "Câu 8. Đại lượng nào sau đây đặc trưng cho tốc độ sinh công của lực?",
            options: [
                "Động năng.",
                "Công suất.",
                "Động lượng.",
                "Mômen lực."
            ],
            correct: 1,
            explain: "Công suất P = A / t đặc trưng cho tốc độ thực hiện công trong một đơn vị thời gian."
        },
        {
            q: "Câu 9. Động lượng của một chất điểm khối lượng m đang chuyển động với vận tốc v được xác định bởi biểu thức",
            options: [
                "p = m * v.",
                "p = 0.5 * m * v^2.",
                "p = m * v^2.",
                "p = m / v."
            ],
            correct: 0,
            explain: "Định nghĩa véc-tơ động lượng của chất điểm: p = m * v."
        },
        {
            q: "Câu 10. Phát biểu nào sau đây không đúng về định luật bảo toàn cơ năng?",
            options: [
                "Cơ năng của hệ bảo toàn nếu chỉ có các lực thế sinh công.",
                "Lực ma sát sinh công làm tiêu hao cơ năng thành nhiệt năng.",
                "Trong va chạm mềm, cơ năng của hệ được bảo toàn hoàn toàn.",
                "Tổng động năng và thế năng của hệ cô lập dưới tác dụng của lực thế là hằng số."
            ],
            correct: 2,
            explain: "Trong va chạm mềm (không đàn hồi), một phần cơ năng bị biến đổi thành nhiệt năng và công biến dạng nên cơ năng không bảo toàn."
        },
        {
            q: "Câu 11. Đơn vị nào sau đây là đơn vị của động lượng?",
            options: [
                "kg.m/s.",
                "N.m.",
                "J/s.",
                "kg.m^2/s."
            ],
            correct: 0,
            explain: "Động lượng p = m * v nên có đơn vị là kg.m/s (hoặc N.s)."
        },
        {
            q: "Câu 12. Khi khối lượng của vật tăng gấp đôi và vận tốc tăng gấp đôi thì động năng của vật tăng lên bao nhiêu lần?",
            options: [
                "2 lần.",
                "4 lần.",
                "8 lần.",
                "16 lần."
            ],
            correct: 2,
            explain: "Động năng W_d = 0.5 * m * v^2. Khi m tăng 2 lần và v tăng 2 lần (v^2 tăng 4 lần) thì động năng tăng 2 * 4 = 8 lần."
        },
        {
            q: "Câu 13. Chọn câu đúng khi nói về mối liên hệ giữa xung lượng của lực và độ biến thiên động lượng.",
            options: [
                "Xung lượng của lực tác dụng trong khoảng thời gian delta_t bằng độ biến thiên động lượng của vật.",
                "Xung lượng của lực bằng thương số giữa động lượng và thời gian.",
                "Xung lượng của lực luôn bằng 0 nếu vật chuyển động tròn đều.",
                "Độ biến thiên động lượng bằng công của lực."
            ],
            correct: 0,
            explain: "Định lý xung lượng của lực: F * delta_t = delta_p = p2 - p1."
        },
        {
            q: "Câu 14. Công của lực ma sát trượt luôn mang giá trị",
            options: [
                "dương.",
                "âm.",
                "bằng 0.",
                "tùy thuộc vào chiều chuyển động."
            ],
            correct: 1,
            explain: "Lực ma sát trượt luôn ngược chiều chuyển động (góc alpha = 180 độ) nên cos(180) = -1, dẫn đến công của lực ma sát trượt luôn là công cản (âm)."
        },
        {
            q: "Câu 15. Lực nào sau đây KHÔNG phải là lực thế?",
            options: [
                "Trọng lực.",
                "Lực đàn hồi của lò xo.",
                "Lực ma sát trượt.",
                "Lực hấp dẫn."
            ],
            correct: 2,
            explain: "Lực ma sát trượt là lực không thế (lực ma sát làm hao phí cơ năng), công của nó phụ thuộc vào dạng đường đi."
        },
        {
            q: "Câu 16. Một súng đại bác khối lượng M bắn một viên đạn khối lượng m với vận tốc v. Vận tốc giật lùi V của súng ngay sau khi bắn được tính theo công thức nào (bỏ qua ma sát)?",
            options: [
                "V = -(m / M) * v.",
                "V = (M / m) * v.",
                "V = -(M / m) * v.",
                "V = (m / M) * v."
            ],
            correct: 0,
            explain: "Theo định luật bảo toàn động lượng cho hệ kín (súng + đạn): 0 = M * V + m * v => V = -(m / M) * v."
        },
        {
            q: "Câu 17. Thế năng trọng trường của một vật khối lượng m ở độ cao h so với mốc thế năng được tính bằng công thức",
            options: [
                "W_t = m * g * h.",
                "W_t = 0.5 * m * g * h.",
                "W_t = m * g / h.",
                "W_t = m * h^2."
            ],
            correct: 0,
            explain: "Biểu thức thế năng trọng trường: W_t = m * g * h."
        },
        {
            q: "Câu 18. Một lò xo có độ cứng k bị biến dạng một đoạn x. Thế năng đàn hồi của lò xo được xác định bằng công thức nào?",
            options: [
                "W_t = k * x.",
                "W_t = 0.5 * k * x^2.",
                "W_t = 0.5 * k * x.",
                "W_t = k * x^2."
            ],
            correct: 1,
            explain: "Biểu thức thế năng đàn hồi của lò xo: W_t = 0.5 * k * x^2."
        },
        {
            q: "Câu 19. Khi vật chuyển động thẳng đều dưới tác dụng của lực kéo F cùng hướng chuyển động, nhận xét nào sau đây đúng?",
            options: [
                "Công của lực kéo bằng 0.",
                "Động năng của vật biến thiên.",
                "Công của lực kéo có độ lớn bằng công của lực ma sát cản trở chuyển động.",
                "Cơ năng của vật tăng liên tục."
            ],
            correct: 2,
            explain: "Chuyển động thẳng đều có tổng lực bằng 0 => F_kéo = F_masat => Công lực kéo triệt tiêu về độ lớn với công cản của lực ma sát."
        },
        {
            q: "Câu 20. Khi ném một vật thẳng đứng lên cao, trong quá trình vật chuyển động đi lên (bỏ qua sức cản không khí)",
            options: [
                "Động năng tăng, thế năng giảm, cơ năng không đổi.",
                "Động năng giảm, thế năng tăng, cơ năng không đổi.",
                "Động năng tăng, thế năng tăng, cơ năng tăng.",
                "Động năng giảm, thế năng giảm, cơ năng giảm."
            ],
            correct: 1,
            explain: "Khi lên cao, độ cao h tăng (thế năng tăng), vận tốc v giảm (động năng giảm), tổng cơ năng được bảo toàn."
        },
        {
            q: "Câu 21. Hai vật có khối lượng m1 và m2 (m1 = 2*m2) chuyển động với cùng động năng. Tỷ số độ lớn động lượng p1 / p2 của hai vật là",

                "0.5.",

        },
        {
            q: "Câu 22. Trong va chạm đàn hồi trực diện giữa hai quả cầu cùng khối lượng m1 = m2, quả cầu 1 chuyển động v1 đến va chạm với quả cầu 2 đang đứng yên. Sau va chạm",
            options: [
                "Quả cầu 1 dừng lại, quả cầu 2 chuyển động với vận tốc v1.",
                "Hai quả cầu dính vào nhau chuyển động với vận tốc v1/2.",
                "Quả cầu 1 bật ngược lại với vận tốc -v1.",
                "Cả hai quả cầu cùng đứng yên."
            ],
            correct: 0,
            explain: "Trong va chạm đàn hồi trực diện cùng khối lượng, hai vật trao đổi vận tốc cho nhau. Vật 1 dừng lại, vật 2 nhận vận tốc v1."
        },
        {
            q: "Câu 23. Trong chuyển động tròn đều của một chất điểm, lực hướng tâm thực hiện một công bằng bao nhiêu?",
            options: [
                "A > 0.",

                "Phụ thuộc vào bán kính quỹ đạo."
            ],
            correct: 2,
            explain: "Lực hướng tâm luôn vuông góc với véc-tơ vận tốc (hướng chuyển động) nên góc alpha = 90 độ => cos(90) = 0 => Công A = 0."
        },
        {

        explanationBox.style.display = "none";
        nextBtn.disabled = true;
        prevBtn.disabled = currentQuestion === 0;

        const q = quizData[currentQuestion];
        questionCounter.innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
        scoreTracker.innerText = `Điểm: ${score}`;
        questionText.innerText = q.q;

        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const options = optionsContainer.children;

        if (selectedIndex === q.correct) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            options[q.correct].classList.add("correct");
        }

        for (let opt of options) {
            opt.classList.add("disabled");
        }

        scoreTracker.innerText = `Điểm: ${score}`;
        explanationText.innerText = q.explain;
        explanationBox.style.display = "block";
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        finalScore.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu. (Đạt ${(score/quizData.length*10).toFixed(1)} điểm)`;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
